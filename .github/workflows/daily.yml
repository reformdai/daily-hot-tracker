name: Daily Hot Tracker

on:
  schedule:
    # 每天 UTC 22:30 运行 (北京时间 6:30)
    - cron: '30 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 推送记忆：每次运行恢复最近一次保存的 state/，运行结束自动另存一份新缓存。
      # 缓存 7 天未访问会被回收；丢失时只是退化为无记忆，不影响推送。
      - name: Restore push history
        uses: actions/cache@v4
        with:
          path: state
          key: push-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            push-history-

      - name: Run daily tracker
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          AIHOT_API_KEY: ${{ secrets.AIHOT_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          JINA_READER_FALLBACK: ${{ vars.JINA_READER_FALLBACK || 'false' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
        run: |
          python main.py --no-rss

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
